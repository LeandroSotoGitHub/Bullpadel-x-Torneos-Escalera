<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu cupón — Bullpadel x Torneos Escalera</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Manrope', system-ui, -apple-system, sans-serif; background: #EEF0F2; }
</style>
</head>
<body>

<div x-data="tarjetaDigital()" x-init="init()" style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;">

  <!-- Cargando -->
  <div x-show="loading" style="color:#6B7280; font-size:14px;">Cargando cupón…</div>

  <!-- No encontrado -->
  <template x-if="!loading && !cupon">
    <div style="max-width:340px; text-align:center; background:#fff; border-radius:16px; padding:32px 24px; color:#3F4650;">
      <div style="font-size:16px; font-weight:800; margin-bottom:8px;">Cupón no encontrado</div>
      <div style="font-size:13px;">El enlace que abriste no corresponde a un cupón válido.</div>
    </div>
  </template>

  <!-- Tarjeta -->
  <template x-if="!loading && cupon">
    <div style="width:100%; max-width:380px; aspect-ratio: 380 / 600; border-radius:22px; background:linear-gradient(165deg, #0f0f01 0%, #17140F 55%, #1D1913 100%); padding:26px; display:flex; flex-direction:column; color:#ffffff; position:relative; overflow:hidden;">

      <div style="position:absolute; top:-70px; right:-70px; width:200px; height:200px; border-radius:999px; background:rgba(200,16,46,0.10);"></div>
      <div style="position:absolute; bottom:-100px; left:-50px; width:230px; height:230px; border-radius:999px; background:rgba(24,160,200,0.06);"></div>

      <div style="display:flex; align-items:center; gap:12px; z-index:1;">
        <img src="assets/bullpadel-logo-blanco.png" style="height:16px; width:auto; display:block;">
        <div style="font-size:13px; font-weight:600; color:#5A6068;">&times;</div>
        <div style="background:#ffffff; border-radius:5px; padding:4px 8px; display:flex; align-items:center;">
          <img src="assets/logo-torneos-escalera.svg" style="height:14px; width:auto; display:block;">
        </div>
      </div>

      <div style="margin-top:24px; z-index:1;">
        <div style="display:flex; align-items:baseline; gap:8px;">
          <div style="font-size:58px; font-weight:800; line-height:1;" x-text="cupon.discount_pct + '%'"></div>
          <div style="font-size:26px; font-weight:800; color:#E23A50;">OFF</div>
        </div>
        <div style="font-size:14px; color:#C9CDD3; margin-top:8px;" x-text="'En ' + cupon.category.toLowerCase()"></div>
      </div>

      <div style="height:1px; background:rgba(79,184,222,0.22); margin:22px 0; z-index:1;"></div>

      <div style="display:flex; flex-direction:column; gap:9px; font-size:13px; color:#E7E9EC; z-index:1;">
        <div style="display:flex; justify-content:space-between;"><span style="color:#7FA9BC;">Válido</span><span x-text="fmtCorta(cupon.valid_from) + ' – ' + fmtCompleta(cupon.valid_to)"></span></div>
        <div style="display:flex; justify-content:space-between;"><span style="color:#7FA9BC;">Canal</span><span x-text="cupon.channel.map(c => c === 'web' ? 'Web' : 'Locales').join(' y ')"></span></div>
        <div style="display:flex; justify-content:space-between;"><span style="color:#7FA9BC;">Puntos de venta</span><span style="text-align:right;" x-text="cupon.points_of_sale ? cupon.points_of_sale.join(', ') : 'Unicenter, Portal Palermo, Alcorta'"></span></div>
      </div>

      <div style="margin-top:auto; z-index:1;">
        <template x-if="cupon.estado !== 'activo'">
          <div style="font-size:12px; font-weight:700; padding:8px 12px; border-radius:8px; margin-bottom:10px; text-align:center;"
               :style="cupon.estado === 'vencido' ? 'background:rgba(192,57,43,0.18); color:#E88379;' : 'background:rgba(107,114,128,0.25); color:#C9CDD3;'"
               x-text="cupon.estado === 'vencido' ? 'Este cupón venció' : 'Este cupón ya fue utilizado'"></div>
        </template>
        <div style="display:flex; align-items:center; gap:14px;">
          <div style="width:64px; height:64px; border-radius:10px; background:#ffffff; flex-shrink:0; display:grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); padding:6px; gap:2px;">
            <template x-for="i in 16" :key="i">
              <div :style="'background:' + (qrPattern[i-1] ? '#0f0f01' : '#ffffff')"></div>
            </template>
          </div>
          <div style="flex:1 1 0;">
            <div style="font-family:monospace; font-size:16px; font-weight:700; letter-spacing:0.04em; color:#ffffff;" x-text="cupon.serial"></div>
            <div style="font-size:11px; color:#8B93A3; margin-top:4px;">Mostrá este código en caja</div>
          </div>
        </div>
      </div>

      <div style="font-size:10px; color:#9AA3B8; margin-top:18px; z-index:1; line-height:1.5;">Válido en bullpadel.com.ar y en los locales físicos de Bullpadel Argentina. Cupón intransferible.</div>

    </div>
  </template>

</div>

<script type="module">
  import Alpine from 'https://cdn.jsdelivr.net/npm/alpinejs@3/dist/module.esm.js';
  import { supabase, formatFecha, formatFechaCompleta } from './js/supabase-client.js';

  Alpine.data('tarjetaDigital', () => ({
      cupon: null,
      loading: true,
      qrPattern: [],

      init() {
        const params = new URLSearchParams(window.location.search);
        const serial = (params.get('serial') || '').trim().toUpperCase();
        this.qrPattern = Array.from({ length: 16 }, () => Math.random() > 0.5);
        if (!serial) {
          this.loading = false;
          return;
        }
        this.cargar(serial);
      },

      fmtCorta: formatFecha,
      fmtCompleta: formatFechaCompleta,

      async cargar(serial) {
        const { data, error } = await supabase.rpc('validar_cupon', { p_serial: serial });
        this.loading = false;
        if (error || !data || data.length === 0) {
          this.cupon = null;
          return;
        }
        this.cupon = { ...data[0], serial };
      },
  }));

  window.Alpine = Alpine;
  Alpine.start();
</script>

</body>
</html>
