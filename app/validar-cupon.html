<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Validar cupón — Torneos Escalera x Bullpadel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/validar-cupon.css">
</head>
<body>

<div x-data="validarCupon()" x-init="init()" class="page">

  <div class="header">
    <img src="assets/bullpadel-logo-blanco.png" class="header__logo">
    <div class="header__title">Validar cupón</div>
    <div class="header__brand">Torneos Escalera</div>
    <button type="button" class="local-badge" :class="!localConfirmado ? 'local-badge--unset' : ''" @click="abrirModalLocal()">
      <span class="local-badge__icon">📍</span>
      <span class="local-badge__text" x-text="localConfirmado ? puntoVenta : 'Elegir local (obligatorio)'"></span>
      <span class="local-badge__hint" x-text="localConfirmado ? 'Cambiar' : 'Obligatorio'"></span>
    </button>
  </div>

  <div class="content">

    <div>
      <div class="field-label">Serial del cupón</div>
      <input type="text" x-model="serial" @keydown.enter="intentarValidar()" placeholder="BP-2609-A1" class="serial-input">
    </div>

    <button class="btn-primary" :disabled="!serial || validando" @click="intentarValidar()">
      <span x-text="validando ? 'Validando…' : 'Validar'"></span>
    </button>

    <div x-show="errorMsg" class="text-error" x-text="errorMsg"></div>

    <div class="divider" x-show="cupon"></div>

    <!-- Estado: activo -->
    <template x-if="cupon && cupon.estado === 'activo'">
      <div class="status-card status-card--activo">
        <div class="status-card__head">
          <div class="status-card__icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 13L10 18L19 7" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="status-card__title">Cupón activo</div>
        </div>
        <div class="status-card__details">
          <div><strong x-text="cupon.discount_pct + '%'"></strong> OFF &middot; <span x-text="cupon.category"></span></div>
          <div x-text="'Canal: ' + cupon.channel.map(c => c === 'web' ? 'Web' : 'Local').join(' + ') + ' · ' + (cupon.points_of_sale ? cupon.points_of_sale.join(', ') : 'Todos los locales')"></div>
          <div x-text="(cupon.usage_mode === 'reutilizable' ? 'Reutilizable' : 'Único uso')"></div>
          <div x-text="'Válido hasta ' + fmtCompleta(cupon.valid_to)"></div>
        </div>
        <div class="status-card__confirm-local">Se va a registrar en <strong x-text="puntoVenta"></strong></div>
        <div class="btn-confirm" :class="canjeando ? 'btn-confirm--loading' : ''" @click="confirmarCanje()">
          <span x-text="canjeando ? 'Registrando…' : 'Confirmar canje'"></span>
        </div>
      </div>
    </template>

    <!-- Estado: vencido -->
    <template x-if="cupon && cupon.estado === 'vencido'">
      <div class="status-card status-card--vencido">
        <div class="status-card__head">
          <div class="status-card__icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="#ffffff" stroke-width="2.2"/><path d="M12 8V12L14.5 14.5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/></svg>
          </div>
          <div class="status-card__title">Cupón vencido</div>
        </div>
        <div class="status-card__message" x-text="'Venció el ' + fmtCompleta(cupon.valid_to) + '. No corresponde aplicar el descuento.'"></div>
        <div class="status-card__blocked">No se puede canjear</div>
      </div>
    </template>

    <!-- Estado: usado -->
    <template x-if="cupon && cupon.estado === 'usado'">
      <div class="status-card status-card--usado">
        <div class="status-card__head">
          <div class="status-card__icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="#ffffff" stroke-width="2.2"/><path d="M7 7L17 17" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/></svg>
          </div>
          <div class="status-card__title">Cupón ya utilizado</div>
        </div>
        <div class="status-card__message">Este cupón ya fue canjeado y es de único uso.</div>
        <div class="status-card__blocked">No se puede canjear</div>
      </div>
    </template>

    <!-- No encontrado -->
    <template x-if="noEncontrado">
      <div class="status-card--not-found">
        No existe un cupón con ese serial. Verificá que esté bien escrito.
      </div>
    </template>

    <!-- Canje confirmado (toast simple) -->
    <div x-show="canjeConfirmado" class="toast-success">
      Canje registrado correctamente.
    </div>

  </div>

  <div class="footer">
    El vendedor solo valida. La carga del % en el ERP la confirma el encargado habilitado.
  </div>

  <!-- Modal obligatorio: elegir local antes de poder validar/confirmar -->
  <template x-if="mostrarModalLocal">
    <div class="modal-overlay-local">
      <div class="modal-local">
        <div class="modal-local__icon">📍</div>
        <div class="modal-local__title">¿En qué local estás?</div>
        <div class="modal-local__subtitle">Es obligatorio para validar cupones y registrar los canjes en el local correcto.</div>
        <div class="modal-local__options">
          <template x-for="p in puntosDeVenta" :key="p">
            <div class="modal-local__option" :class="puntoVenta === p ? 'active' : ''" @click="puntoVenta = p" x-text="p"></div>
          </template>
        </div>
        <button class="btn-primary" @click="confirmarLocal()">Confirmar</button>
      </div>
    </div>
  </template>

</div>

<script type="module">
  import Alpine from 'https://cdn.jsdelivr.net/npm/alpinejs@3/dist/module.esm.js';
  import { supabase, PUNTOS_DE_VENTA, formatFechaCompleta } from './js/supabase-client.js';

  const POS_STORAGE_KEY = 'te_punto_venta';

  Alpine.data('validarCupon', () => ({
      puntosDeVenta: PUNTOS_DE_VENTA,
      puntoVenta: PUNTOS_DE_VENTA[0],
      localConfirmado: false,
      mostrarModalLocal: false,
      accionPendiente: null,
      serial: '',
      cupon: null,
      noEncontrado: false,
      validando: false,
      canjeando: false,
      canjeConfirmado: false,
      errorMsg: '',

      init() {
        try {
          const saved = localStorage.getItem(POS_STORAGE_KEY);
          if (saved && this.puntosDeVenta.includes(saved)) this.puntoVenta = saved;
        } catch {}

        const params = new URLSearchParams(window.location.search);
        const serialDesdeQr = (params.get('serial') || '').trim();
        if (serialDesdeQr) {
          this.serial = serialDesdeQr.toUpperCase();
          this.intentarValidar();
        }
      },

      abrirModalLocal() {
        this.mostrarModalLocal = true;
      },

      confirmarLocal() {
        try { localStorage.setItem(POS_STORAGE_KEY, this.puntoVenta); } catch {}
        this.localConfirmado = true;
        this.mostrarModalLocal = false;

        if (this.accionPendiente) {
          const accion = this.accionPendiente;
          this.accionPendiente = null;
          accion();
        }
      },

      intentarValidar() {
        if (!this.serial) return;
        if (!this.localConfirmado) {
          this.accionPendiente = () => this.validar();
          this.mostrarModalLocal = true;
          return;
        }
        this.validar();
      },

      fmtCompleta: formatFechaCompleta,

      async validar() {
        this.validando = true;
        this.errorMsg = '';
        this.cupon = null;
        this.noEncontrado = false;
        this.canjeConfirmado = false;

        const serialLimpio = this.serial.trim().toUpperCase();
        const { data, error } = await supabase.rpc('validar_cupon', { p_serial: serialLimpio });

        this.validando = false;

        if (error) {
          this.errorMsg = error.message;
          return;
        }
        if (!data || data.length === 0) {
          this.noEncontrado = true;
          return;
        }
        this.cupon = data[0];
      },

      async confirmarCanje() {
        this.canjeando = true;
        const serialLimpio = this.serial.trim().toUpperCase();

        const { data, error } = await supabase.rpc('confirmar_canje', {
          p_serial: serialLimpio,
          p_point_of_sale: this.puntoVenta,
        });

        this.canjeando = false;

        if (error) {
          this.errorMsg = error.message;
          return;
        }

        const resultado = data[0];
        if (resultado.ok) {
          await this.validar();
          this.canjeConfirmado = true;
          setTimeout(() => { this.canjeConfirmado = false; }, 4000);
        } else {
          await this.validar();
          this.errorMsg = resultado.mensaje;
        }
      },
  }));

  window.Alpine = Alpine;
  Alpine.start();
</script>

</body>
</html>
