<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Nuevo cupón — Torneos Escalera x Bullpadel</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/mkt-panel.css">
<link rel="stylesheet" href="css/crear-cupon.css">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>

<div x-data="crearCupon()" x-init="init()" class="page">

  <div class="topbar">
    <img src="assets/bullpadel-logo-negro.png" class="topbar__logo">
    <div class="topbar__divider"></div>
    <div class="topbar__brand">&times; Torneos Escalera</div>
    <nav class="topbar__nav">
      <a href="crear-cupon.html" class="topbar__nav-link active">Crear cupón</a>
      <a href="listado-cupones.html" class="topbar__nav-link">Listado</a>
    </nav>
    <div class="topbar__tag">Panel interno &middot; MKT</div>
  </div>

  <!-- Portón de clave MKT -->
  <template x-if="!mktKey">
    <div class="key-gate">
      <div class="key-gate__title">Acceso MKT / comercial</div>
      <div class="key-gate__subtitle">Ingresá la clave de acceso para crear cupones.</div>
      <input type="password" x-model="keyInput" @keydown.enter="guardarKey()" placeholder="Clave de acceso" class="field-input key-gate__input">
      <div class="btn-primary btn-primary--block" @click="guardarKey()">Ingresar</div>
      <div x-show="authError" class="key-gate__error" x-text="authError"></div>
    </div>
  </template>

  <template x-if="mktKey">
  <div>
    <div class="header-block">
      <div class="header-block__title">Nuevo cupón</div>
      <div class="header-block__subtitle">Definí las variables del cupón. Al confirmar se genera un serial único.</div>
    </div>

    <div class="form-layout">

      <div class="form-fields">

        <div class="card">
          <div class="card-title">Descuento y vigencia</div>
          <div class="form-row">
            <div>
              <div class="field-label">Descuento (%)</div>
              <input type="number" min="1" max="100" x-model.number="discountPct" class="field-input">
            </div>
            <div class="field--wide">
              <div class="field-label">Desde</div>
              <input type="date" x-model="validFrom" class="field-input">
            </div>
            <div class="field--wide">
              <div class="field-label">Hasta</div>
              <input type="date" x-model="validTo" class="field-input">
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">Cantidad</div>
          <input type="number" min="1" max="100" x-model.number="cantidad" class="field-input field--narrow">
          <div class="usage-hint">Genera varios cupones con estas mismas condiciones, cada uno con su propio serial.</div>
        </div>

        <div class="card">
          <div class="card-title">Canal</div>
          <div class="channel-row">
            <div class="pill" :class="channelWeb ? 'pill-on' : 'pill-off'" @click="channelWeb = !channelWeb">Web</div>
            <div class="pill" :class="channelLocal ? 'pill-on' : 'pill-off'" @click="toggleChannelLocal()">Local</div>
          </div>
        </div>

        <div class="card" :class="!channelLocal ? 'card--disabled' : ''">
          <div class="card-title">Punto de venta</div>
          <div class="field-label" x-show="!channelLocal">Solo aplica si el canal incluye Local.</div>
          <div class="pos-row">
            <div class="pill" :class="posTodos ? 'pill-solid-on' : 'pill-solid-off'" @click="posTodos = true">Todos</div>
            <template x-for="p in puntosDeVenta" :key="p">
              <div class="pill" :class="(!posTodos && posSeleccionados.includes(p)) ? 'pill-solid-on' : 'pill-solid-off'"
                   @click="posTodos = false; togglePos(p)" x-text="p"></div>
            </template>
          </div>
        </div>

        <div class="card">
          <div class="card-title">Categoría de producto</div>
          <select x-model="category" class="field-input">
            <template x-for="c in categorias" :key="c">
              <option :value="c" x-text="c"></option>
            </template>
          </select>
        </div>

        <div class="card">
          <div class="card-title">Modalidad de uso</div>
          <div class="toggle-wrap">
            <div class="toggle-opt" :class="usageMode === 'unico_uso' ? 'active' : ''" @click="usageMode = 'unico_uso'">Único uso</div>
            <div class="toggle-opt" :class="usageMode === 'reutilizable' ? 'active' : ''" @click="usageMode = 'reutilizable'">Reutilizable</div>
          </div>
          <div class="usage-hint">Requiere validación comercial antes de activarse.</div>
        </div>

      </div>

      <div class="preview-panel">
        <div class="card-title">Vista previa</div>

        <div class="preview-card">
          <img src="assets/bullpadel-logo-blanco.png" class="preview-card__logo"> 
          <div class="preview-card__discount" x-text="(discountPct || 0) + '% OFF'"></div>
          <div class="preview-card__category" x-text="'En ' + category.toLowerCase()"></div>
          <div class="preview-card__divider"></div>
          <div class="preview-card__validity" x-text="'Válido ' + (validFrom ? fmtCorta(validFrom) : '—') + ' – ' + (validTo ? fmtCompleta(validTo) : '—')"></div>
          <div class="preview-card__channels">
            <div x-show="channelWeb" class="preview-card__channel-tag">Web</div>
            <div x-show="channelLocal" class="preview-card__channel-tag">Local</div>
          </div>
          <div class="preview-card__serial">
            <span x-text="resultado ? resultado.serial : 'Se asigna al confirmar'"></span>
          </div>
        </div>

        <div class="preview-hint">Así la recibe la jugadora. El serial se asigna al confirmar.</div>

        <button class="btn-primary btn-primary--block mt-auto" :disabled="loading || !channelWeb && !channelLocal" @click="generar()">
          <span x-text="loading ? 'Generando…' : (cantidad > 1 ? 'Generar ' + cantidad + ' cupones' : 'Generar cupón')"></span>
        </button>

        <div x-show="errorMsg" class="text-error" x-text="errorMsg"></div>

        <template x-if="resultados.length === 1">
          <div class="result-box">
            Cupón <strong x-text="resultados[0].serial"></strong> creado.
            <a :href="'tarjeta-digital.html?serial=' + resultados[0].serial" target="_blank">Ver tarjeta digital →</a>
          </div>
        </template>

        <template x-if="resultados.length > 1">
          <div class="result-box">
            <div class="result-box__title" x-text="resultados.length + ' cupones creados.'"></div>
            <div class="result-serial-list">
              <template x-for="r in resultados" :key="r.id">
                <div x-text="r.serial"></div>
              </template>
            </div>
            <button class="btn-primary btn-primary--block result-zip-btn" :disabled="zipLoading" @click="descargarZip()">
              <span x-text="zipLoading ? ('Generando ' + zipProgreso + '/' + resultados.length + '…') : '⤓ Descargar ZIP'"></span>
            </button>
            <div x-show="zipError" class="text-error result-zip-error" x-text="zipError"></div>
          </div>
        </template>

        <a href="listado-cupones.html" class="link-listado">Ver listado completo →</a>
      </div>

    </div>
  </div>
  </template>

</div>

<script type="module">
  import Alpine from 'https://cdn.jsdelivr.net/npm/alpinejs@3/dist/module.esm.js';
  import { supabase, PUNTOS_DE_VENTA, CATEGORIAS, formatFecha, formatFechaCompleta } from './js/supabase-client.js';
  import { getMktKey, setMktKey, esErrorDeAutorizacion } from './js/mkt-key.js';

  Alpine.data('crearCupon', () => ({
      mktKey: '',
      keyInput: '',
      authError: '',
      puntosDeVenta: PUNTOS_DE_VENTA,
      categorias: CATEGORIAS,
      discountPct: 20,
      validFrom: '',
      validTo: '',
      channelWeb: true,
      channelLocal: true,
      posTodos: true,
      posSeleccionados: [],
      category: 'Bolsos',
      usageMode: 'reutilizable',
      cantidad: 1,
      loading: false,
      errorMsg: '',
      resultados: [],
      zipLoading: false,
      zipProgreso: 0,
      zipError: '',

      init() {
        this.mktKey = getMktKey();
        const hoy = new Date();
        this.validFrom = hoy.toISOString().slice(0, 10);
        const enUnMes = new Date(hoy.getFullYear(), hoy.getMonth() + 1, hoy.getDate());
        this.validTo = enUnMes.toISOString().slice(0, 10);
      },

      guardarKey() {
        if (!this.keyInput) return;
        setMktKey(this.keyInput);
        this.mktKey = this.keyInput;
        this.authError = '';
      },

      togglePos(p) {
        const i = this.posSeleccionados.indexOf(p);
        if (i >= 0) this.posSeleccionados.splice(i, 1);
        else this.posSeleccionados.push(p);
      },

      toggleChannelLocal() {
        this.channelLocal = !this.channelLocal;
        if (!this.channelLocal) {
          this.posTodos = true;
          this.posSeleccionados = [];
        }
      },

      fmtCorta: formatFecha,
      fmtCompleta: formatFechaCompleta,

      async generar() {
        this.loading = true;
        this.errorMsg = '';
        this.resultados = [];
        this.zipError = '';

        const channel = [];
        if (this.channelWeb) channel.push('web');
        if (this.channelLocal) channel.push('local');

        const points_of_sale = this.posTodos ? null : this.posSeleccionados;
        const cantidad = Math.max(1, Math.min(100, this.cantidad || 1));

        const rpc = cantidad > 1 ? 'crear_cupones_lote' : 'crear_cupon';
        const params = {
          p_mkt_key: this.mktKey,
          p_discount_pct: this.discountPct,
          p_category: this.category,
          p_channel: channel,
          p_points_of_sale: points_of_sale,
          p_valid_from: this.validFrom,
          p_valid_to: this.validTo,
          p_usage_mode: this.usageMode,
        };
        if (cantidad > 1) params.p_cantidad = cantidad;

        const { data, error } = await supabase.rpc(rpc, params);

        this.loading = false;

        if (error) {
          if (esErrorDeAutorizacion(error)) {
            this.mktKey = '';
            this.authError = 'Clave incorrecta.';
          } else {
            this.errorMsg = error.message;
          }
          return;
        }

        this.resultados = data;
      },

      async descargarZip() {
        this.zipLoading = true;
        this.zipProgreso = 0;
        this.zipError = '';

        try {
          const zip = new window.JSZip();

          for (const r of this.resultados) {
            const blob = await this.generarImagenTarjeta(r.serial);
            zip.file(`cupon-${r.serial}.png`, blob);
            this.zipProgreso++;
          }

          const contenido = await zip.generateAsync({ type: 'blob' });
          const url = URL.createObjectURL(contenido);
          const a = document.createElement('a');
          a.href = url;
          a.download = `cupones-${new Date().toISOString().slice(0, 10)}.zip`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        } catch (err) {
          this.zipError = 'No se pudo generar el ZIP. Probá de nuevo.';
        } finally {
          this.zipLoading = false;
        }
      },

      // Renderiza tarjeta-digital.html en un iframe oculto (mismo origen) y reusa
      // su logica de armado de tarjeta + QR para generar el PNG de un serial puntual.
      generarImagenTarjeta(serial) {
        return new Promise((resolve, reject) => {
          const iframe = document.createElement('iframe');
          iframe.className = 'zip-iframe-oculto';
          iframe.src = `tarjeta-digital.html?serial=${encodeURIComponent(serial)}`;

          const limpiar = () => iframe.remove();
          const timeout = setTimeout(() => {
            limpiar();
            reject(new Error('timeout'));
          }, 15000);

          iframe.onload = () => {
            const esperar = () => {
              const el = iframe.contentDocument && iframe.contentDocument.querySelector('[x-data]');
              const datos = el && iframe.contentWindow.Alpine && iframe.contentWindow.Alpine.$data(el);
              if (datos && datos.cupon && datos.qrSvg) {
                datos.generarCanvas()
                  .then(canvas => canvas.toBlob(blob => {
                    clearTimeout(timeout);
                    limpiar();
                    resolve(blob);
                  }, 'image/png'))
                  .catch(err => { clearTimeout(timeout); limpiar(); reject(err); });
              } else {
                setTimeout(esperar, 100);
              }
            };
            esperar();
          };

          document.body.appendChild(iframe);
        });
      },
  }));

  window.Alpine = Alpine;
  Alpine.start();
</script>

</body>
</html>
